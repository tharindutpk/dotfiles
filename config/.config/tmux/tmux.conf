# ~/.config/tmux/tmux.conf
#
# Sessions are projects, windows are tasks, panes are splits.
# tmux-sessionizer (prefix + f) is the intended way in; see the dotfiles README.

# ---------------------------------------------------------------- terminal ---
# Neovim is unusable inside tmux without the next three lines: escape-time
# makes <Esc> lag, focus-events breaks :checktime and gitsigns, and without
# RGB the catppuccin palette degrades to 256 colours.
set  -g  escape-time 0
set  -g  focus-events on
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",*:RGB"
set  -as terminal-features ",*:usstyle"          # undercurl for LSP diagnostics
set  -as terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set  -as terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

set  -g  default-shell "$SHELL"
set  -g  history-limit 50000
set  -g  mouse on
set  -g  set-clipboard on

# ------------------------------------------------------------------ prefix ---
# C-b is awkward. C-a is the usual replacement, and `C-a C-a` still sends a
# literal C-a through to fish, so beginning-of-line keeps working.
unbind C-b
set  -g prefix C-a
bind   C-a send-prefix

# ------------------------------------------------------------------ windows ---
set  -g  base-index 1                # windows count from 1, matching the keys
setw -g  pane-base-index 1
set  -g  renumber-windows on         # no gaps after closing a window
set  -g  detach-on-destroy off       # closing a session drops into another one
set  -g  allow-rename off

# Splits and new windows inherit the current directory.
bind   | split-window -h -c "#{pane_current_path}"
bind   - split-window -v -c "#{pane_current_path}"
bind   c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane focus on prefix + hjkl. C-hjkl is deliberately left alone -- Neovim
# uses it for window focus, and stealing it here would break that.
bind   h select-pane -L
bind   j select-pane -D
bind   k select-pane -U
bind   l select-pane -R

# Resize, repeatable: hold the prefix and keep tapping.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind   z resize-pane -Z                              # zoom the current pane
bind   x kill-pane
bind   X kill-window

# ----------------------------------------------------------------- sessions ---
bind   f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"   # fuzzy project switcher
bind   s choose-tree -Zs                             # visual session picker
bind -r ( switch-client -p
bind -r ) switch-client -n
bind   r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --------------------------------------------------------------- copy mode ---
setw -g mode-keys vi
bind   Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ------------------------------------------------------------------- status ---
# Catppuccin Mocha, on top so it does not stack with lualine at the bottom.
set  -g status-position top
set  -g status-interval 5
set  -g status-justify left
set  -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set  -g status-left-length 40
set  -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e,nobold] "

set  -g status-right-length 60
set  -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f38ba8]● ,}#[fg=#a6adc8]%a %d %b #[fg=#89b4fa]%H:%M "

setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I #W "
setw -g window-status-separator ""

set  -g pane-border-style "fg=#313244"
set  -g pane-active-border-style "fg=#89b4fa"
set  -g message-style "bg=#313244,fg=#cdd6f4"
set  -g mode-style "bg=#45475a,fg=#cdd6f4"
